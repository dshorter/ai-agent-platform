services:
  # Shared Postgres — hosts both databases:
  #   - hvac_demo (original HVAC test case, schema loaded manually)
  #   - ai_agent_platform (generic crew spine, auto-created on first boot)
  postgres:
    image: postgres:15-alpine
    container_name: hvac-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=hvac_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-hvac_demo_pass_2025}
      - POSTGRES_DB=hvac_demo
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Init scripts create ai_agent_platform DB + load its schema on first boot.
      # See database/README.md for existing-deployment migration.
      - ./database/init/10_create_ai_agent_platform.sh:/docker-entrypoint-initdb.d/10_create_ai_agent_platform.sh:ro
      - ./database/ai_agent_platform/001_init.sql:/docker-entrypoint-initdb.d/ai_agent_platform_schema.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hvac_user -d hvac_demo"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  predictor:
    profiles: ["predictor"]
    build:
      context: ../predictor_ingest
      dockerfile: ../ai-agent-platform/predictor/Dockerfile
    container_name: predictor-pipeline
    restart: unless-stopped
    volumes:
      - predictor-data:/app/data
      - ../predictor_ingest/web:/app/web:ro
    environment:
      - TZ=America/New_York
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    networks:
      - app-network

  web:
    image: nginx:alpine
    container_name: web-server
    restart: unless-stopped
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../predictor_ingest/web:/srv/predictor:ro
    ports:
      - "127.0.0.1:8080:80"
    networks:
      - app-network

  ngrok:
    image: ngrok/ngrok:alpine
    container_name: ngrok
    restart: unless-stopped
    command:
      - "http"
      - "web-server:80"
      - "--url=agents-platform.ngrok.io"
      - "--log-level=info"
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    ports:
      - "127.0.0.1:4040:4040"
    depends_on:
      - web
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
  predictor-data:
    driver: local
