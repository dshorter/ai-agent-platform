.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;style&gt;
  #newsroom-flow-navigator {
    --nf-bg: light-dark(#f4f0e7, #171815);
    --nf-surface: light-dark(#fffdf8, #22231f);
    --nf-surface-strong: light-dark(#ffffff, #292b26);
    --nf-ink: light-dark(#1e211d, #f2f0e8);
    --nf-muted: light-dark(#667067, #afb5aa);
    --nf-line: light-dark(#d8d4ca, #44473f);
    --nf-accent: #d84a32;
    --nf-accent-ink: #ffffff;
    --nf-soft: color-mix(in srgb, var(--nf-accent) 13%, var(--nf-surface));
    --nf-info: light-dark(#315d72, #8fc8df);
    width: 100%;
    color: var(--nf-ink);
    font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;
    color-scheme: light dark;
  }

  #newsroom-flow-navigator * { box-sizing: border-box; }
  #newsroom-flow-navigator button,
  #newsroom-flow-navigator select { font: inherit; }

  #newsroom-flow-navigator .nf-window {
    min-height: 650px;
    background: var(--nf-bg);
    border: 1px solid var(--nf-line);
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 18px 52px light-dark(rgba(55, 45, 30, .13), rgba(0, 0, 0, .28));
  }

  #newsroom-flow-navigator .nf-topbar {
    min-height: 68px;
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 12px 18px;
    background: var(--nf-surface);
    border-bottom: 1px solid var(--nf-line);
  }

  #newsroom-flow-navigator .nf-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 180px;
    font-weight: 500;
    letter-spacing: .06em;
  }

  #newsroom-flow-navigator .nf-brand-mark {
    display: grid;
    place-items: center;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--nf-accent);
    color: var(--nf-accent-ink);
  }

  #newsroom-flow-navigator .nf-context {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  #newsroom-flow-navigator .nf-kicker {
    color: var(--nf-muted);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .08em;
  }

  #newsroom-flow-navigator .nf-context strong {
    display: block;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  #newsroom-flow-navigator .nf-live {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 7px 10px;
    border-radius: 999px;
    background: var(--nf-soft);
    color: var(--nf-accent);
    font-size: 12px;
    font-weight: 500;
    white-space: nowrap;
  }

  #newsroom-flow-navigator .nf-live-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: currentColor;
  }

  #newsroom-flow-navigator .nf-layout {
    display: grid;
    grid-template-columns: 180px minmax(0, 1fr);
    min-height: 580px;
  }

  #newsroom-flow-navigator .nf-rail {
    padding: 18px 12px;
    background: var(--nf-surface);
    border-right: 1px solid var(--nf-line);
  }

  #newsroom-flow-navigator .nf-rail-label {
    margin: 0 8px 8px;
    color: var(--nf-muted);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .08em;
  }

  #newsroom-flow-navigator .nf-nav {
    display: grid;
    gap: 5px;
  }

  #newsroom-flow-navigator .nf-nav button {
    width: 100%;
    min-height: 40px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border: 0;
    border-radius: 9px;
    background: transparent;
    color: var(--nf-muted);
    text-align: left;
    cursor: pointer;
  }

  #newsroom-flow-navigator .nf-nav button[aria-pressed=&quot;true&quot;] {
    background: var(--nf-soft);
    color: var(--nf-ink);
    font-weight: 500;
  }

  #newsroom-flow-navigator .nf-nav svg { width: 17px; height: 17px; }

  #newsroom-flow-navigator .nf-rail-note {
    margin: 28px 8px 0;
    padding-top: 16px;
    border-top: 1px solid var(--nf-line);
    color: var(--nf-muted);
    font-size: 12px;
    line-height: 1.45;
  }

  #newsroom-flow-navigator .nf-main {
    padding: 22px;
    min-width: 0;
  }

  #newsroom-flow-navigator .nf-toolbar {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 14px;
    margin-bottom: 20px;
  }

  #newsroom-flow-navigator h2,
  #newsroom-flow-navigator h3,
  #newsroom-flow-navigator p { margin: 0; }

  #newsroom-flow-navigator h2 {
    font-size: clamp(22px, 3vw, 30px);
    line-height: 1.15;
    font-weight: 500;
    letter-spacing: -.025em;
  }

  #newsroom-flow-navigator .nf-subtitle {
    margin-top: 5px;
    color: var(--nf-muted);
    font-size: 14px;
  }

  #newsroom-flow-navigator .nf-field {
    display: grid;
    gap: 5px;
    color: var(--nf-muted);
    font-size: 12px;
  }

  #newsroom-flow-navigator select {
    min-height: 40px;
    min-width: 176px;
    padding: 7px 34px 7px 11px;
    border: 1px solid var(--nf-line);
    border-radius: 9px;
    background: var(--nf-surface-strong);
    color: var(--nf-ink);
  }

  #newsroom-flow-navigator .nf-content {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 260px;
    gap: 18px;
    align-items: start;
  }

  #newsroom-flow-navigator .nf-canvas {
    min-width: 0;
  }

  #newsroom-flow-navigator .nf-status-line {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
    color: var(--nf-muted);
    font-size: 12px;
  }

  #newsroom-flow-navigator .nf-progress-text { color: var(--nf-ink); }

  #newsroom-flow-navigator .nf-flow {
    position: relative;
    display: grid;
    grid-template-columns: repeat(4, minmax(110px, 1fr));
    gap: 34px 22px;
    padding: 18px 4px 26px;
  }

  #newsroom-flow-navigator .nf-flow::before {
    content: &quot;&quot;;
    position: absolute;
    left: 7%;
    right: 7%;
    top: 46px;
    height: 2px;
    background: var(--nf-line);
  }

  #newsroom-flow-navigator .nf-flow::after {
    content: &quot;&quot;;
    position: absolute;
    left: 7%;
    right: 7%;
    top: 160px;
    height: 2px;
    background: var(--nf-line);
  }

  #newsroom-flow-navigator .nf-stage {
    position: relative;
    z-index: 1;
    min-width: 0;
    display: grid;
    justify-items: center;
    gap: 8px;
    border: 0;
    background: transparent;
    color: var(--nf-ink);
    cursor: pointer;
  }

  #newsroom-flow-navigator .nf-stage-circle {
    width: 58px;
    height: 58px;
    display: grid;
    place-items: center;
    border: 2px solid var(--nf-line);
    border-radius: 50%;
    background: var(--nf-surface-strong);
    color: var(--nf-muted);
    transition: transform 160ms ease, background 160ms ease, color 160ms ease, border-color 160ms ease;
  }

  #newsroom-flow-navigator .nf-stage:hover .nf-stage-circle { transform: translateY(-2px); }
  #newsroom-flow-navigator .nf-stage[aria-current=&quot;step&quot;] .nf-stage-circle {
    background: var(--nf-accent);
    border-color: var(--nf-accent);
    color: var(--nf-accent-ink);
  }

  #newsroom-flow-navigator .nf-stage[data-complete=&quot;true&quot;] .nf-stage-circle {
    border-color: var(--nf-accent);
    color: var(--nf-accent);
  }

  #newsroom-flow-navigator .nf-stage[data-dim=&quot;true&quot;] { opacity: .3; }
  #newsroom-flow-navigator .nf-stage svg { width: 21px; height: 21px; }

  #newsroom-flow-navigator .nf-stage-name {
    font-size: 13px;
    font-weight: 500;
    text-align: center;
  }

  #newsroom-flow-navigator .nf-stage-owner {
    color: var(--nf-muted);
    font-size: 12px;
    text-align: center;
  }

  #newsroom-flow-navigator .nf-role-strip {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 7px;
    padding-top: 16px;
    border-top: 1px solid var(--nf-line);
  }

  #newsroom-flow-navigator .nf-role-strip span {
    margin-right: 3px;
    color: var(--nf-muted);
    font-size: 12px;
  }

  #newsroom-flow-navigator .nf-role {
    min-height: 34px;
    padding: 6px 10px;
    border: 1px solid var(--nf-line);
    border-radius: 999px;
    background: var(--nf-surface);
    color: var(--nf-ink);
    font-size: 12px;
    cursor: pointer;
  }

  #newsroom-flow-navigator .nf-role[aria-pressed=&quot;true&quot;] {
    background: var(--nf-ink);
    border-color: var(--nf-ink);
    color: var(--nf-surface);
  }

  #newsroom-flow-navigator .nf-detail {
    padding: 18px;
    border-radius: 13px;
    background: var(--nf-surface-strong);
    box-shadow: 0 10px 28px light-dark(rgba(55, 45, 30, .10), rgba(0, 0, 0, .22));
  }

  #newsroom-flow-navigator .nf-step-label {
    color: var(--nf-accent);
    font-size: 12px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: .08em;
  }

  #newsroom-flow-navigator .nf-detail h3 {
    margin-top: 6px;
    font-size: 21px;
    line-height: 1.2;
    font-weight: 500;
  }

  #newsroom-flow-navigator .nf-owner {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 12px;
    color: var(--nf-muted);
    font-size: 13px;
  }

  #newsroom-flow-navigator .nf-owner svg { width: 16px; height: 16px; }

  #newsroom-flow-navigator .nf-detail-grid {
    display: grid;
    gap: 14px;
    margin-top: 20px;
    padding: 16px 0;
    border-top: 1px solid var(--nf-line);
    border-bottom: 1px solid var(--nf-line);
  }

  #newsroom-flow-navigator .nf-detail-item dt {
    margin-bottom: 4px;
    color: var(--nf-muted);
    font-size: 12px;
  }

  #newsroom-flow-navigator .nf-detail-item dd {
    margin: 0;
    font-size: 13px;
    line-height: 1.4;
  }

  #newsroom-flow-navigator .nf-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 16px;
  }

  #newsroom-flow-navigator .nf-action {
    min-height: 39px;
    border: 1px solid var(--nf-line);
    border-radius: 9px;
    background: transparent;
    color: var(--nf-ink);
    cursor: pointer;
  }

  #newsroom-flow-navigator .nf-action-primary {
    background: var(--nf-accent);
    border-color: var(--nf-accent);
    color: var(--nf-accent-ink);
  }

  #newsroom-flow-navigator .nf-handoff {
    min-height: 22px;
    margin-top: 10px;
    color: var(--nf-muted);
    font-size: 12px;
    line-height: 1.35;
  }

  #newsroom-flow-navigator[data-compact=&quot;true&quot;] .nf-main { padding: 16px; }
  #newsroom-flow-navigator[data-compact=&quot;true&quot;] .nf-flow { gap: 22px 14px; }
  #newsroom-flow-navigator[data-show-rail=&quot;false&quot;] .nf-layout { grid-template-columns: 1fr; }
  #newsroom-flow-navigator[data-show-rail=&quot;false&quot;] .nf-rail { display: none; }

  @media (max-width: 820px) {
    #newsroom-flow-navigator .nf-layout { grid-template-columns: 1fr; }
    #newsroom-flow-navigator .nf-rail { display: none; }
    #newsroom-flow-navigator .nf-content { grid-template-columns: 1fr; }
    #newsroom-flow-navigator .nf-detail { max-width: none; }
  }

  @media (max-width: 590px) {
    #newsroom-flow-navigator .nf-window { border-radius: 12px; }
    #newsroom-flow-navigator .nf-topbar { align-items: flex-start; flex-wrap: wrap; }
    #newsroom-flow-navigator .nf-brand { min-width: 0; }
    #newsroom-flow-navigator .nf-live { margin-left: auto; }
    #newsroom-flow-navigator .nf-context { order: 3; flex-basis: 100%; }
    #newsroom-flow-navigator .nf-main { padding: 16px 12px; }
    #newsroom-flow-navigator .nf-toolbar { align-items: stretch; flex-direction: column; }
    #newsroom-flow-navigator select { width: 100%; }
    #newsroom-flow-navigator .nf-flow { grid-template-columns: repeat(2, 1fr); gap: 28px 18px; }
    #newsroom-flow-navigator .nf-flow::before,
    #newsroom-flow-navigator .nf-flow::after { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    #newsroom-flow-navigator .nf-stage-circle { transition: none; }
  }
&lt;/style&gt;

            &lt;div class=&quot;nf-owner&quot;&gt;&lt;i data-lucide=&quot;user-round&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span id=&quot;nf-owner&quot;&gt;Owner: Reporter&lt;/span&gt;&lt;/div&gt;

&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;newsroom-flow-navigator&#x27;);
  const stages = [
    { title: &#x27;Signal&#x27;, kind: &#x27;intake&#x27;, owner: &#x27;News desk&#x27;, roles: [&#x27;Editor&#x27;, &#x27;Audience&#x27;], input: &#x27;A tip, alert, assignment, dataset change, or newsroom observation&#x27;, done: &#x27;The signal is logged, time-stamped, and routed to the right desk&#x27;, next: &#x27;Reporter receives the signal with urgency and source context&#x27; },
    { title: &#x27;Verify&#x27;, kind: &#x27;gate&#x27;, owner: &#x27;Reporter&#x27;, roles: [&#x27;Reporter&#x27;, &#x27;Editor&#x27;, &#x27;Legal&#x27;], input: &#x27;A tip, alert, eyewitness report, or primary-source signal&#x27;, done: &#x27;Core claim is confirmed by two sources or one authoritative record&#x27;, next: &#x27;Assigning editor receives a verified alert and known unknowns&#x27; },
    { title: &#x27;Assign&#x27;, kind: &#x27;decision&#x27;, owner: &#x27;Assigning editor&#x27;, roles: [&#x27;Editor&#x27;, &#x27;Reporter&#x27;, &#x27;Visuals&#x27;], input: &#x27;Verified facts, impact, audience value, and urgency&#x27;, done: &#x27;Angle, format, owner, deadline, and update cadence are explicit&#x27;, next: &#x27;Story team receives a one-sentence brief and reporting plan&#x27; },
    { title: &#x27;Report &amp; draft&#x27;, kind: &#x27;work&#x27;, owner: &#x27;Story team&#x27;, roles: [&#x27;Reporter&#x27;, &#x27;Visuals&#x27;], input: &#x27;Assignment brief, source list, evidence, and constraints&#x27;, done: &#x27;Draft separates verified facts, uncertainty, context, and attribution&#x27;, next: &#x27;Editor receives copy, evidence links, visuals, and unresolved questions&#x27; },
    { title: &#x27;Edit &amp; review&#x27;, kind: &#x27;gate&#x27;, owner: &#x27;Editors&#x27;, roles: [&#x27;Editor&#x27;, &#x27;Reporter&#x27;, &#x27;Legal&#x27;], input: &#x27;Draft, source trail, fact-check notes, and risk flags&#x27;, done: &#x27;Accuracy, fairness, structure, standards, and legal risk pass review&#x27;, next: &#x27;Packaging team receives approved copy plus any publication conditions&#x27; },
    { title: &#x27;Package&#x27;, kind: &#x27;production&#x27;, owner: &#x27;Visuals + audience&#x27;, roles: [&#x27;Visuals&#x27;, &#x27;Audience&#x27;, &#x27;Editor&#x27;], input: &#x27;Approved story, assets, metadata, headline options, and distribution plan&#x27;, done: &#x27;Headline, image, accessibility, SEO, alerts, and social language are ready&#x27;, next: &#x27;Publishing desk receives one release-ready package&#x27; },
    { title: &#x27;Publish&#x27;, kind: &#x27;release&#x27;, owner: &#x27;Publishing desk&#x27;, roles: [&#x27;Editor&#x27;, &#x27;Audience&#x27;], input: &#x27;Approved package, timing decision, and embargo status&#x27;, done: &#x27;Canonical version is live and distribution channels are confirmed&#x27;, next: &#x27;Live team receives monitoring ownership and correction protocol&#x27; },
    { title: &#x27;Update&#x27;, kind: &#x27;loop&#x27;, owner: &#x27;Live team&#x27;, roles: [&#x27;Reporter&#x27;, &#x27;Editor&#x27;, &#x27;Audience&#x27;], input: &#x27;New facts, reader signals, corrections, and performance context&#x27;, done: &#x27;Material changes are reflected, labeled, and redistributed when needed&#x27;, next: &#x27;Story either loops back to reporting or closes into archive and learning&#x27; }
  ];

  const workflowCopy = {
    breaking: [&#x27;Transit strike may begin Friday&#x27;, &#x27;Now: confirming the event with two independent sources&#x27;, &#x27;12–20 min&#x27;],
    daily: [&#x27;City budget committee advances housing measure&#x27;, &#x27;Now: shaping the assignment and reporting plan&#x27;, &#x27;2–6 hr&#x27;],
    investigation: [&#x27;Public contracts review: vendor relationships&#x27;, &#x27;Now: building the evidence trail and source matrix&#x27;, &#x27;2–12 wk&#x27;]
  };

  const roleStageMap = {
    Reporter: [1, 2, 3, 4, 7],
    Editor: [0, 1, 2, 4, 5, 6, 7],
    Visuals: [2, 3, 5],
    Audience: [0, 5, 6, 7],
    Legal: [1, 4]
  };

  let current = 1;
  let selectedRole = null;

  const stageButtons = [...root.querySelectorAll(&#x27;.nf-stage&#x27;)];
  const el = id =&gt; root.querySelector(&#x27;#&#x27; + id);

  function render() {
    const stage = stages[current];
    stageButtons.forEach((button, index) =&gt; {
      if (index === current) button.setAttribute(&#x27;aria-current&#x27;, &#x27;step&#x27;);
      else button.removeAttribute(&#x27;aria-current&#x27;);
      button.dataset.complete = index &lt; current ? &#x27;true&#x27; : &#x27;false&#x27;;
      button.dataset.dim = selectedRole &amp;&amp; !roleStageMap[selectedRole].includes(index) ? &#x27;true&#x27; : &#x27;false&#x27;;
    });
    el(&#x27;nf-step-label&#x27;).textContent = `Stage ${current + 1} · ${stage.kind}`;
    el(&#x27;nf-stage-title&#x27;).textContent = stage.title;
    el(&#x27;nf-owner&#x27;).textContent = `Owner: ${stage.owner}`;
    el(&#x27;nf-input&#x27;).textContent = stage.input;
    el(&#x27;nf-done&#x27;).textContent = stage.done;
    el(&#x27;nf-next&#x27;).textContent = stage.next;
    el(&#x27;nf-progress&#x27;).textContent = `${current + 1} of ${stages.length}`;
    el(&#x27;nf-back&#x27;).disabled = current === 0;
    el(&#x27;nf-next-button&#x27;).textContent = current === stages.length - 1 ? &#x27;Close loop&#x27; : &#x27;Next stage&#x27;;
  }

  stageButtons.forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; {
    current = Number(button.dataset.stage);
    render();
  }));

  root.querySelectorAll(&#x27;.nf-role&#x27;).forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; {
    const nextRole = button.dataset.role;
    selectedRole = selectedRole === nextRole ? null : nextRole;
    root.querySelectorAll(&#x27;.nf-role&#x27;).forEach(item =&gt; item.setAttribute(&#x27;aria-pressed&#x27;, String(item.dataset.role === selectedRole)));
    el(&#x27;nf-status-copy&#x27;).textContent = selectedRole ? `${selectedRole} touches ${roleStageMap[selectedRole].length} stages` : workflowCopy[el(&#x27;nf-workflow&#x27;).value][1];
    render();
  }));

  el(&#x27;nf-back&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
    current = Math.max(0, current - 1);
    render();
  });

  el(&#x27;nf-next-button&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
    const previous = stages[current].title;
    current = current === stages.length - 1 ? 0 : current + 1;
    el(&#x27;nf-handoff&#x27;).textContent = current === 0 ? &#x27;Loop closed. Learning returned to intake.&#x27; : `${previous} handed off to ${stages[current].title}.`;
    render();
  });

  el(&#x27;nf-workflow&#x27;).addEventListener(&#x27;change&#x27;, event =&gt; {
    const [title, status, pace] = workflowCopy[event.target.value];
    el(&#x27;nf-story-title&#x27;).textContent = title;
    el(&#x27;nf-status-copy&#x27;).textContent = status;
    el(&#x27;nf-view-subtitle&#x27;).textContent = `One shared map from first signal to published follow-up · typical pace ${pace}.`;
    el(&#x27;nf-handoff&#x27;).textContent = &#x27;&#x27;;
  });

  const viewCopy = {
    flow: [&#x27;Story lifecycle&#x27;, &#x27;One shared map from first signal to published follow-up.&#x27;],
    role: [&#x27;Role handoffs&#x27;, &#x27;Choose a role below to reveal every stage it touches.&#x27;],
    deadline: [&#x27;Deadline path&#x27;, &#x27;The same workflow, organized around the next irreversible handoff.&#x27;]
  };

  root.querySelectorAll(&#x27;.nf-nav button&#x27;).forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; {
    root.querySelectorAll(&#x27;.nf-nav button&#x27;).forEach(item =&gt; item.setAttribute(&#x27;aria-pressed&#x27;, String(item === button)));
    const [title, subtitle] = viewCopy[button.dataset.view];
    el(&#x27;nf-view-title&#x27;).textContent = title;
    el(&#x27;nf-view-subtitle&#x27;).textContent = subtitle;
    if (button.dataset.view === &#x27;role&#x27; &amp;&amp; !selectedRole) root.querySelector(&#x27;.nf-role&#x27;).click();
    if (button.dataset.view === &#x27;deadline&#x27;) {
      selectedRole = null;
      root.querySelectorAll(&#x27;.nf-role&#x27;).forEach(item =&gt; item.setAttribute(&#x27;aria-pressed&#x27;, &#x27;false&#x27;));
      el(&#x27;nf-status-copy&#x27;).textContent = &#x27;Next hard gate: verified facts before assignment&#x27;;
    }
    render();
  }));

  const design = { compact: false, showRoleRail: true, accent: &#x27;#d84a32&#x27; };
  function applyDesign() {
    root.dataset.compact = String(design.compact);
    root.dataset.showRail = String(design.showRoleRail);
    root.style.setProperty(&#x27;--nf-accent&#x27;, design.accent);
  }
  applyDesign();

  if (globalThis.Tweak) {
    const tweak = new Tweak({ container: root, onChange: applyDesign });
    tweak.addToggle(design, &#x27;compact&#x27;, { label: &#x27;Compact density&#x27;, reference: &#x27;newsroom.compact&#x27; });
    tweak.addToggle(design, &#x27;showRoleRail&#x27;, { label: &#x27;Show view rail&#x27;, reference: &#x27;newsroom.showRoleRail&#x27; });
    tweak.addColorPicker(design, &#x27;accent&#x27;, { label: &#x27;Newsroom accent&#x27;, reference: &#x27;--nf-accent&#x27; });
  }

  render();
})();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
