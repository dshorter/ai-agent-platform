:root[data-theme=&quot;light&quot;] {
  color-scheme: light;
}

:root[data-theme=&quot;dark&quot;] {
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */
  --color-background-primary: var(
    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))
  );
  --color-border-secondary: var(
    --border,
    light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))
  );

  margin: 0;
  padding: var(--visualize-paint-gutter, 0px);
  color: var(--foreground);
  background: transparent !important;
  font-family: var(--font-sans) !important;
  font-size: var(--font-size-normal);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

a {
  color: color-mix(in srgb, var(--viz-accent) 80%, var(--viz-text) 20%);
  cursor: pointer;
  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {
  margin-block: 0;
}

h1 {
  font-size: var(--font-size-h1);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h2 {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {
  font-size: var(--font-size-h3);
  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {
  font-weight: var(--font-weight-medium);
}

code:not(pre code) {
  display: inline;
  padding: 1px 6px;
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.92em;
  overflow-wrap: anywhere;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  word-break: break-word;
}

.table-responsive {
  width: 100%;
  overflow-x: auto;
  scrollbar-width: thin;
}

.table {
  width: 100%;
  border-collapse: collapse;
  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {
  padding-block: 10px;
  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {
  padding-block: 6px;
}

.table.table-sm :is(th, td):not(:last-child) {
  padding-inline-end: 16px;
}

.table :is(.text-end, [align=&quot;right&quot;]) {
  text-align: end;
  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align=&quot;center&quot;]) {
  text-align: center;
}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: var(--corner-shape);
  color: var(--card-foreground);
  background: var(--card);
}

#widget &gt; :not(.card, .progress) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

hr {
  width: 100%;
  height: 1px;
  margin-block: 6px;
  border: 0;
  background: var(--border);
}

.nav {
  display: flex;
  min-width: 0;
  align-items: center;
  gap: 4px;
}

.progress {
  display: flex;
  height: 8px;
  margin-block: calc((var(--line-height-normal, 1.5em) - 8px) / 2);
  overflow: hidden;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
}

.progress-bar:only-child {
  border-radius: var(--radius-full);
}

.progress-bar {
  height: 100%;
  flex-shrink: 0;
  border: 0;
  background: var(--viz-series-1);
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);
}

small,
.text-small,
.viz-badge {
  font-size: var(--font-size-small);
  line-height: var(--line-height-small);
}

.text-muted {
  color: var(--muted-foreground);
}

.tabular-nums {
  font-variant-numeric: tabular-nums;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls &gt; .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.nav-link,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

.btn,
.nav-link {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin: 0;
  padding: 0 8px;
  -webkit-app-region: no-drag;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: var(--cursor-interaction, pointer);
  text-align: center;
  text-decoration: none;
  white-space: nowrap;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

.btn:is(.btn-block, .viz-tile) {
  inline-size: 100%;
}

.btn.viz-tile {
  min-width: 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

a.btn {
  cursor: pointer;
  text-decoration: none;
}

.btn:not(:disabled):hover,
.nav-link:not(:disabled):not([aria-disabled=&quot;true&quot;]):hover {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);
}

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);
  background-clip: padding-box;
}

.btn-ghost {
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.btn-ghost:not(:disabled):hover {
  color: var(--foreground);
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.nav-pills .nav-link {
  min-width: 0;
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.nav-justified .nav-link {
  flex: 1 1 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

.nav-pills .nav-link.active {
  color: var(--foreground);
  background: var(--muted);
}

.btn:disabled,
.nav-link:disabled,
.nav-link[aria-disabled=&quot;true&quot;] {
  cursor: not-allowed;
  opacity: 0.4;
}

[data-lucide] {
  stroke-width: 1.6;
}

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);
}

.form-control {
  display: block;
  width: 100%;
  min-height: 28px;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--foreground);
  background: var(--secondary);
}

.form-control::placeholder {
  color: var(--muted-foreground);
}

.form-control[type=&quot;file&quot;] {
  padding: 0;
  overflow: hidden;
  cursor: var(--cursor-interaction, pointer);
}

.form-control[type=&quot;file&quot;]::file-selector-button {
  min-height: 26px;
  margin-right: 8px;
  padding: 0 8px;
  border: 0;
  border-right: 1px solid var(--input);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: inherit;
  font: inherit;
}

.form-control[type=&quot;file&quot;]:not(:disabled):hover::file-selector-button {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-control-color[type=&quot;color&quot;] {
  width: 40px;
  height: 28px;
  padding: 3px;
  cursor: var(--cursor-interaction, pointer);
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch-wrapper {
  padding: 0;
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch {
  border: 0;
  border-radius: calc(var(--radius-lg) - 4px);
  corner-shape: var(--corner-shape);
}

textarea.form-control {
  height: auto;
  min-height: 72px;
  padding: 8px 10px;
  resize: vertical;
}

.form-control:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-control:disabled,
.form-select:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.form-select {
  appearance: none;
  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:
    linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%),
    linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);
  background-position:
    calc(100% - 14px) 50%,
    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;body&gt;
&lt;style&gt;
  #newsroom-operating-manual-v2 {
    --nf-bg: light-dark(#f4f0e7, #171815);
    --nf-surface: light-dark(#fffdf8, #22231f);
    --nf-surface-strong: light-dark(#ffffff, #292b26);
    --nf-ink: light-dark(#1e211d, #f2f0e8);
    --nf-muted: light-dark(#667067, #afb5aa);
    --nf-line: light-dark(#d8d4ca, #44473f);
    --nf-accent: #d84a32;
    --nf-accent-ink: #ffffff;
    --nf-soft: color-mix(in srgb, var(--nf-accent) 13%, var(--nf-surface));
    --nf-info: light-dark(#315d72, #8fc8df);
    width: 100%;
    color: var(--nf-ink);
    font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;
    color-scheme: light dark;
  }

  #newsroom-operating-manual-v2 * { box-sizing: border-box; }
  #newsroom-operating-manual-v2 button,
  #newsroom-operating-manual-v2 select { font: inherit; }

  #newsroom-operating-manual-v2 .nf-window {
    min-height: 650px;
    background: var(--nf-bg);
    border: 1px solid var(--nf-line);
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 18px 52px light-dark(rgba(55, 45, 30, .13), rgba(0, 0, 0, .28));
  }

  #newsroom-operating-manual-v2 .nf-topbar {
    min-height: 68px;
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 12px 18px;
    background: var(--nf-surface);
    border-bottom: 1px solid var(--nf-line);
  }

  #newsroom-operating-manual-v2 .nf-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 180px;
    font-weight: 500;
    letter-spacing: .06em;
  }

  #newsroom-operating-manual-v2 .nf-brand-mark {
    display: grid;
    place-items: center;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--nf-accent);
    color: var(--nf-accent-ink);
  }

  #newsroom-operating-manual-v2 .nf-context {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  #newsroom-operating-manual-v2 .nf-context &gt; div { min-width: 0; width: 100%; }

  #newsroom-operating-manual-v2 .nf-kicker {
    color: var(--nf-muted);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .08em;
  }

  #newsroom-operating-manual-v2 .nf-context strong {
    display: block;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  #newsroom-operating-manual-v2 .nf-live {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 7px 10px;
    border-radius: 999px;
    background: var(--nf-soft);
    color: var(--nf-accent);
    font-size: 12px;
    font-weight: 500;
    white-space: nowrap;
  }

  #newsroom-operating-manual-v2 .nf-live-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: currentColor;
  }

  #newsroom-operating-manual-v2 .nf-layout {
    display: grid;
    grid-template-columns: 180px minmax(0, 1fr);
    min-height: 580px;
  }

  #newsroom-operating-manual-v2 .nf-rail {
    padding: 18px 12px;
    background: var(--nf-surface);
    border-right: 1px solid var(--nf-line);
  }

  #newsroom-operating-manual-v2 .nf-rail-label {
    margin: 0 8px 8px;
    color: var(--nf-muted);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .08em;
  }

  #newsroom-operating-manual-v2 .nf-nav {
    display: grid;
    gap: 5px;
  }

  #newsroom-operating-manual-v2 .nf-nav button {
    width: 100%;
    min-height: 40px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border: 0;
    border-radius: 9px;
    background: transparent;
    color: var(--nf-muted);
    text-align: left;
    cursor: pointer;
  }

  #newsroom-operating-manual-v2 .nf-nav button[aria-pressed=&quot;true&quot;] {
    background: var(--nf-soft);
    color: var(--nf-ink);
    font-weight: 500;
  }

  #newsroom-operating-manual-v2 .nf-nav svg { width: 17px; height: 17px; }

  #newsroom-operating-manual-v2 .nf-rail-note {
    margin: 28px 8px 0;
    padding-top: 16px;
    border-top: 1px solid var(--nf-line);
    color: var(--nf-muted);
    font-size: 12px;
    line-height: 1.45;
  }

  #newsroom-operating-manual-v2 .nf-main {
    padding: 22px;
    min-width: 0;
  }

  #newsroom-operating-manual-v2 .nf-toolbar {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 14px;
    margin-bottom: 20px;
  }

  #newsroom-operating-manual-v2 h2,
  #newsroom-operating-manual-v2 h3,
  #newsroom-operating-manual-v2 p { margin: 0; }

  #newsroom-operating-manual-v2 h2 {
    font-size: clamp(22px, 3vw, 30px);
    line-height: 1.15;
    font-weight: 500;
    letter-spacing: -.025em;
  }

  #newsroom-operating-manual-v2 .nf-subtitle {
    margin-top: 5px;
    color: var(--nf-muted);
    font-size: 14px;
  }

  #newsroom-operating-manual-v2 .nf-field {
    display: grid;
    gap: 5px;
    color: var(--nf-muted);
    font-size: 12px;
  }

  #newsroom-operating-manual-v2 select {
    min-height: 40px;
    min-width: 176px;
    padding: 7px 34px 7px 11px;
    border: 1px solid var(--nf-line);
    border-radius: 9px;
    background: var(--nf-surface-strong);
    color: var(--nf-ink);
  }

  #newsroom-operating-manual-v2 .nf-content {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 260px;
    gap: 18px;
    align-items: start;
  }

  #newsroom-operating-manual-v2 .nf-canvas {
    min-width: 0;
  }

  #newsroom-operating-manual-v2 .nf-status-line {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
    color: var(--nf-muted);
    font-size: 12px;
  }

  #newsroom-operating-manual-v2 .nf-progress-text { color: var(--nf-ink); }

  #newsroom-operating-manual-v2 .nf-flow {
    position: relative;
    display: grid;
    grid-template-columns: repeat(4, minmax(110px, 1fr));
    gap: 34px 22px;
    padding: 18px 4px 26px;
  }

  #newsroom-operating-manual-v2 .nf-flow::before {
    content: &quot;&quot;;
    position: absolute;
    left: 7%;
    right: 7%;
    top: 46px;
    height: 2px;
    background: var(--nf-line);
  }

  #newsroom-operating-manual-v2 .nf-flow::after {
    content: &quot;&quot;;
    position: absolute;
    left: 7%;
    right: 7%;
    top: 198px;
    height: 2px;
    background: var(--nf-line);
  }

  #newsroom-operating-manual-v2 .nf-stage {
    position: relative;
    z-index: 1;
    min-width: 0;
    display: grid;
    justify-items: center;
    gap: 8px;
    border: 0;
    background: transparent;
    color: var(--nf-ink);
    cursor: pointer;
  }

  #newsroom-operating-manual-v2 .nf-stage-circle {
    width: 58px;
    height: 58px;
    display: grid;
    place-items: center;
    border: 2px solid var(--nf-line);
    border-radius: 50%;
    background: var(--nf-surface-strong);
    color: var(--nf-muted);
    transition: transform 160ms ease, background 160ms ease, color 160ms ease, border-color 160ms ease;
  }

  #newsroom-operating-manual-v2 .nf-stage:hover .nf-stage-circle { transform: translateY(-2px); }
  #newsroom-operating-manual-v2 .nf-stage[aria-current=&quot;step&quot;] .nf-stage-circle {
    background: var(--nf-accent);
    border-color: var(--nf-accent);
    color: var(--nf-accent-ink);
  }

  #newsroom-operating-manual-v2 .nf-stage[data-dim=&quot;true&quot;] { opacity: .3; }
  #newsroom-operating-manual-v2 .nf-stage svg { width: 21px; height: 21px; }

  #newsroom-operating-manual-v2 .nf-stage-name {
    font-size: 13px;
    font-weight: 500;
    text-align: center;
  }

  #newsroom-operating-manual-v2 .nf-stage-owner {
    color: var(--nf-muted);
    font-size: 12px;
    text-align: center;
  }

  #newsroom-operating-manual-v2 .nf-role-strip {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 7px;
    padding-top: 16px;
    border-top: 1px solid var(--nf-line);
  }

  #newsroom-operating-manual-v2 .nf-role-strip span {
    margin-right: 3px;
    color: var(--nf-muted);
    font-size: 12px;
  }

  #newsroom-operating-manual-v2 .nf-role {
    min-height: 34px;
    padding: 6px 10px;
    border: 1px solid var(--nf-line);
    border-radius: 999px;
    background: var(--nf-surface);
    color: var(--nf-ink);
    font-size: 12px;
    cursor: pointer;
  }

  #newsroom-operating-manual-v2 .nf-role[aria-pressed=&quot;true&quot;] {
    background: var(--nf-ink);
    border-color: var(--nf-ink);
    color: var(--nf-surface);
  }

  #newsroom-operating-manual-v2 .nf-role-gallery {
    display: none;
    margin-bottom: 18px;
  }

  #newsroom-operating-manual-v2[data-system-view=&quot;role&quot;] .nf-role-gallery { display: block; }
  #newsroom-operating-manual-v2[data-system-view=&quot;role&quot;] .nf-role-strip { display: none; }

  #newsroom-operating-manual-v2 .nf-role-gallery-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 9px;
  }

  #newsroom-operating-manual-v2 .nf-role-gallery-head strong {
    font-size: 13px;
    font-weight: 500;
  }

  #newsroom-operating-manual-v2 .nf-role-gallery-head span {
    color: var(--nf-muted);
    font-size: 11px;
  }

  #newsroom-operating-manual-v2 .nf-role-gallery-grid {
    display: grid;
    grid-template-columns: repeat(5, minmax(84px, 1fr));
    gap: 8px;
  }

  #newsroom-operating-manual-v2 .nf-role-card {
    min-height: 116px;
    display: grid;
    justify-items: center;
    align-content: center;
    gap: 6px;
    padding: 9px 6px;
    border-radius: 11px;
    background: var(--nf-surface-strong);
    text-align: center;
  }

  #newsroom-operating-manual-v2 .nf-role-card[aria-pressed=&quot;true&quot;] {
    border-color: var(--nf-accent);
    background: var(--nf-soft);
    color: var(--nf-ink);
    box-shadow: inset 0 0 0 1px var(--nf-accent);
  }

  #newsroom-operating-manual-v2 .nf-role-art,
  #newsroom-operating-manual-v2 .nf-role-system-icon {
    width: 58px;
    height: 58px;
  }

  #newsroom-operating-manual-v2 .nf-role-art {
    display: block;
    object-fit: contain;
  }

  #newsroom-operating-manual-v2 .nf-role-system-icon {
    display: grid;
    place-items: center;
    color: var(--nf-info);
  }

  #newsroom-operating-manual-v2 .nf-role-system-icon svg { width: 38px; height: 38px; }

  #newsroom-operating-manual-v2 .nf-role-card strong {
    display: block;
    font-size: 12px;
    font-weight: 500;
    line-height: 1.2;
  }

  #newsroom-operating-manual-v2 .nf-role-card small {
    display: block;
    margin-top: 2px;
    color: var(--nf-muted);
    font-size: 10px;
    line-height: 1.2;
  }

  #newsroom-operating-manual-v2 .nf-detail {
    padding: 18px;
    border-radius: 13px;
    background: var(--nf-surface-strong);
    box-shadow: 0 10px 28px light-dark(rgba(55, 45, 30, .10), rgba(0, 0, 0, .22));
  }

  #newsroom-operating-manual-v2 .nf-step-label {
    color: var(--nf-accent);
    font-size: 12px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: .08em;
  }

  #newsroom-operating-manual-v2 .nf-detail h3 {
    margin-top: 6px;
    font-size: 21px;
    line-height: 1.2;
    font-weight: 500;
  }

  #newsroom-operating-manual-v2 .nf-owner {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 12px;
    color: var(--nf-muted);
    font-size: 13px;
  }

  #newsroom-operating-manual-v2 .nf-owner svg { width: 16px; height: 16px; }

  #newsroom-operating-manual-v2 .nf-detail-grid {
    display: grid;
    gap: 14px;
    margin-top: 20px;
    padding: 16px 0;
    border-top: 1px solid var(--nf-line);
    border-bottom: 1px solid var(--nf-line);
  }

  #newsroom-operating-manual-v2 .nf-detail-item dt {
    margin-bottom: 4px;
    color: var(--nf-muted);
    font-size: 12px;
  }

  #newsroom-operating-manual-v2 .nf-detail-item dd {
    margin: 0;
    font-size: 13px;
    line-height: 1.4;
  }

  #newsroom-operating-manual-v2 .nf-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 16px;
  }

  #newsroom-operating-manual-v2 .nf-actions[hidden] { display: none; }

  #newsroom-operating-manual-v2 .nf-action {
    min-height: 39px;
    border: 1px solid var(--nf-line);
    border-radius: 9px;
    background: transparent;
    color: var(--nf-ink);
    cursor: pointer;
  }

  #newsroom-operating-manual-v2 .nf-action-primary {
    background: var(--nf-accent);
    border-color: var(--nf-accent);
    color: var(--nf-accent-ink);
  }

                  &lt;span class=&quot;nf-stage-circle&quot;&gt;&lt;i data-lucide=&quot;list-checks&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/span&gt;
                  &lt;span class=&quot;nf-stage-name&quot;&gt;Propose triage&lt;/span&gt;&lt;span class=&quot;nf-stage-owner&quot;&gt;Wire + chief&lt;/span&gt;

                &lt;button class=&quot;nf-stage&quot; type=&quot;button&quot; data-stage=&quot;4&quot;&gt;
                  &lt;span class=&quot;nf-stage-circle&quot;&gt;&lt;i data-lucide=&quot;route&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/span&gt;
                  &lt;span class=&quot;nf-stage-name&quot;&gt;Gate ① · route&lt;/span&gt;&lt;span class=&quot;nf-stage-owner&quot;&gt;Operator&lt;/span&gt;
                &lt;/button&gt;
                &lt;button class=&quot;nf-stage&quot; type=&quot;button&quot; data-stage=&quot;5&quot;&gt;
                  &lt;span class=&quot;nf-stage-circle&quot;&gt;&lt;i data-lucide=&quot;file-pen-line&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/span&gt;
                  &lt;span class=&quot;nf-stage-name&quot;&gt;Create draft&lt;/span&gt;&lt;span class=&quot;nf-stage-owner&quot;&gt;Writer&lt;/span&gt;
                &lt;/button&gt;
                &lt;button class=&quot;nf-stage&quot; type=&quot;button&quot; data-stage=&quot;6&quot;&gt;
                  &lt;span class=&quot;nf-stage-circle&quot;&gt;&lt;i data-lucide=&quot;shield-check&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/span&gt;
                  &lt;span class=&quot;nf-stage-name&quot;&gt;Gate ② · approve&lt;/span&gt;&lt;span class=&quot;nf-stage-owner&quot;&gt;Operator&lt;/span&gt;
                &lt;/button&gt;
                &lt;button class=&quot;nf-stage&quot; type=&quot;button&quot; data-stage=&quot;7&quot;&gt;
                  &lt;span class=&quot;nf-stage-circle&quot;&gt;&lt;i data-lucide=&quot;send&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/span&gt;
                  &lt;span class=&quot;nf-stage-name&quot;&gt;Queue &amp; release&lt;/span&gt;&lt;span class=&quot;nf-stage-owner&quot;&gt;Release + generator&lt;/span&gt;
                &lt;/button&gt;
              &lt;/div&gt;

              &lt;div class=&quot;nf-role-strip&quot; aria-label=&quot;Highlight role involvement&quot;&gt;
                &lt;span&gt;Stage role&lt;/span&gt;
                &lt;button class=&quot;nf-role&quot; type=&quot;button&quot; data-role=&quot;Scout&quot; aria-pressed=&quot;true&quot;&gt;Scout&lt;/button&gt;
                &lt;button class=&quot;nf-role&quot; type=&quot;button&quot; data-role=&quot;Wire&quot; aria-pressed=&quot;false&quot;&gt;Wire Editor&lt;/button&gt;
                &lt;button class=&quot;nf-role&quot; type=&quot;button&quot; data-role=&quot;Editor&quot; aria-pressed=&quot;false&quot;&gt;Editor&lt;/button&gt;
                &lt;button class=&quot;nf-role&quot; type=&quot;button&quot; data-role=&quot;Writer&quot; aria-pressed=&quot;false&quot;&gt;Writer&lt;/button&gt;
                &lt;button class=&quot;nf-role&quot; type=&quot;button&quot; data-role=&quot;Release&quot; aria-pressed=&quot;false&quot;&gt;Release&lt;/button&gt;
              &lt;/div&gt;
            &lt;/section&gt;

            &lt;aside class=&quot;nf-detail&quot; aria-live=&quot;polite&quot;&gt;
              &lt;div class=&quot;nf-label-row&quot;&gt;&lt;span class=&quot;nf-step-label&quot; id=&quot;nf-step-label&quot;&gt;Stage 1 · intake&lt;/span&gt;&lt;/div&gt;
              &lt;h3 id=&quot;nf-stage-title&quot;&gt;Ingest ore&lt;/h3&gt;
              &lt;div class=&quot;nf-owner&quot;&gt;&lt;i data-lucide=&quot;user-round&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span id=&quot;nf-owner&quot;&gt;Owner: Scout intake&lt;/span&gt;&lt;/div&gt;
              &lt;dl class=&quot;nf-detail-grid&quot;&gt;
                &lt;div class=&quot;nf-detail-item&quot;&gt;&lt;dt id=&quot;nf-input-label&quot;&gt;Reads&lt;/dt&gt;&lt;dd id=&quot;nf-input&quot;&gt;Session logs; explicit walks can also read git, documents and ledgers&lt;/dd&gt;&lt;/div&gt;
                &lt;div class=&quot;nf-detail-item&quot;&gt;&lt;dt id=&quot;nf-done-label&quot;&gt;Writes&lt;/dt&gt;&lt;dd id=&quot;nf-done&quot;&gt;New session rows into scout_session_log; no model call&lt;/dd&gt;&lt;/div&gt;
                &lt;div class=&quot;nf-detail-item&quot;&gt;&lt;dt id=&quot;nf-next-label&quot;&gt;Guardrail&lt;/dt&gt;&lt;dd id=&quot;nf-next&quot;&gt;Capture is passive: ingestion never initiates synthesis or changes editorial state&lt;/dd&gt;&lt;/div&gt;
              &lt;/dl&gt;
              &lt;div class=&quot;nf-actions&quot; id=&quot;nf-detail-actions&quot;&gt;
                &lt;button class=&quot;nf-action&quot; id=&quot;nf-back&quot; type=&quot;button&quot;&gt;Previous&lt;/button&gt;

              &lt;p class=&quot;nf-handoff&quot; id=&quot;nf-handoff&quot;&gt;&lt;/p&gt;

        &lt;/section&gt;

        &lt;section class=&quot;nf-pane&quot; id=&quot;nf-bottle-pane&quot; hidden&gt;
          &lt;div class=&quot;nf-toolbar&quot;&gt;
            &lt;div&gt;
              &lt;h2&gt;How the voice bottle enters a draft&lt;/h2&gt;
              &lt;p class=&quot;nf-subtitle&quot;&gt;Shape stays in the Writer prompt; voice arrives from exemplars at runtime.&lt;/p&gt;
            &lt;/div&gt;
          &lt;/div&gt;

          &lt;div class=&quot;nf-bottle-grid&quot;&gt;
            &lt;section aria-label=&quot;Voice bottle inputs and draft output&quot;&gt;
              &lt;div class=&quot;nf-voice-definition&quot;&gt;&lt;i data-lucide=&quot;mic-off&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span&gt;&lt;strong&gt;Voice here means written register, not recorded audio.&lt;/strong&gt; The Writer receives the assignment, voice exemplars, and evidence as text.&lt;/span&gt;&lt;/div&gt;

              &lt;div class=&quot;nf-injection-map&quot; id=&quot;nf-injection-map&quot; data-active-context=&quot;system&quot;&gt;
                &lt;div class=&quot;nf-input-groups&quot;&gt;
                  &lt;section class=&quot;nf-input-group&quot; aria-label=&quot;Story-specific context&quot;&gt;
                    &lt;div class=&quot;nf-input-group-head&quot;&gt;&lt;strong&gt;Story context&lt;/strong&gt;&lt;span&gt;changes per lead&lt;/span&gt;&lt;/div&gt;
                    &lt;div class=&quot;nf-input-stack&quot;&gt;
                      &lt;button class=&quot;nf-bottle-node&quot; type=&quot;button&quot; data-bottle=&quot;assignment&quot; aria-pressed=&quot;false&quot;&gt;
                        &lt;span class=&quot;nf-node-icon&quot;&gt;&lt;i data-lucide=&quot;notebook-pen&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/span&gt;&lt;span class=&quot;nf-node-title&quot;&gt;Claimed lead&lt;/span&gt;&lt;span class=&quot;nf-node-copy&quot;&gt;What to write · ID, pitch, why-now, type&lt;/span&gt;
                      &lt;/button&gt;
                      &lt;button class=&quot;nf-bottle-node&quot; type=&quot;button&quot; data-bottle=&quot;evidence&quot; aria-pressed=&quot;false&quot;&gt;
                        &lt;span class=&quot;nf-node-icon&quot;&gt;&lt;i data-lucide=&quot;search-check&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/span&gt;&lt;span class=&quot;nf-node-title&quot;&gt;Evidence roam&lt;/span&gt;&lt;span class=&quot;nf-node-copy&quot;&gt;What is true · cited threads become receipts&lt;/span&gt;
                      &lt;/button&gt;
                    &lt;/div&gt;
                  &lt;/section&gt;

                  &lt;section class=&quot;nf-input-group&quot; aria-label=&quot;Reusable system context&quot;&gt;
                    &lt;div class=&quot;nf-input-group-head&quot;&gt;&lt;strong&gt;System context&lt;/strong&gt;&lt;span&gt;reused across drafts&lt;/span&gt;&lt;/div&gt;
                    &lt;div class=&quot;nf-input-stack&quot;&gt;
                      &lt;button class=&quot;nf-bottle-node&quot; type=&quot;button&quot; data-bottle=&quot;shape&quot; aria-pressed=&quot;false&quot;&gt;
                        &lt;span class=&quot;nf-node-icon&quot;&gt;&lt;i data-lucide=&quot;ruler&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/span&gt;&lt;span class=&quot;nf-node-title&quot;&gt;Shape prompt&lt;/span&gt;&lt;span class=&quot;nf-node-copy&quot;&gt;What form · beats, size contract, schema&lt;/span&gt;
                      &lt;/button&gt;
                      &lt;button class=&quot;nf-bottle-node&quot; type=&quot;button&quot; data-bottle=&quot;bottle&quot; aria-pressed=&quot;true&quot;&gt;
                        &lt;span class=&quot;nf-node-icon&quot;&gt;&lt;i data-lucide=&quot;flask-conical&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/span&gt;&lt;span class=&quot;nf-node-title&quot;&gt;Voice bottle&lt;/span&gt;&lt;span class=&quot;nf-node-copy&quot;&gt;How it sounds · moves + sorted exemplars&lt;/span&gt;
                      &lt;/button&gt;
                    &lt;/div&gt;
                  &lt;/section&gt;
                &lt;/div&gt;

                &lt;div class=&quot;nf-funnel&quot; role=&quot;img&quot; aria-label=&quot;Story context and reusable system context converge into one Writer call&quot;&gt;
                  &lt;div class=&quot;nf-funnel-lane nf-funnel-lane-story&quot;&gt;&lt;span&gt;lead + receipts&lt;/span&gt;&lt;/div&gt;
                  &lt;div class=&quot;nf-funnel-lane nf-funnel-lane-system&quot;&gt;&lt;span&gt;shape + voice&lt;/span&gt;&lt;/div&gt;
                  &lt;div class=&quot;nf-funnel-merge&quot;&gt;&lt;span&gt;same model context&lt;/span&gt;&lt;strong&gt;All four constraints present&lt;/strong&gt;&lt;/div&gt;
                &lt;/div&gt;

                &lt;button class=&quot;nf-writer-node&quot; type=&quot;button&quot; data-bottle=&quot;seat&quot; aria-pressed=&quot;false&quot;&gt;
                  &lt;span class=&quot;nf-node-icon&quot;&gt;&lt;i data-lucide=&quot;brain-circuit&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/span&gt;
                  &lt;span&gt;&lt;span class=&quot;nf-node-title&quot;&gt;Writer synthesis&lt;/span&gt;&lt;span class=&quot;nf-node-copy&quot;&gt;One call composes form, register, assignment, and receipts&lt;/span&gt;&lt;/span&gt;
                  &lt;i data-lucide=&quot;sparkles&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;
                &lt;/button&gt;

                &lt;div class=&quot;nf-output-channel&quot; aria-hidden=&quot;true&quot;&gt;&lt;span&gt;strict structured output + provenance&lt;/span&gt;&lt;/div&gt;

                &lt;div class=&quot;nf-output-row&quot;&gt;
                  &lt;button class=&quot;nf-output-node&quot; type=&quot;button&quot; data-bottle=&quot;output&quot; aria-pressed=&quot;false&quot;&gt;
                    &lt;span class=&quot;nf-node-icon&quot;&gt;&lt;i data-lucide=&quot;file-json&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/span&gt;&lt;span class=&quot;nf-node-title&quot;&gt;Banked draft&lt;/span&gt;&lt;span class=&quot;nf-node-copy&quot;&gt;Structured JSON + mechanical copyDraft stamp&lt;/span&gt;
                  &lt;/button&gt;
                  &lt;div class=&quot;nf-review-link&quot; aria-hidden=&quot;true&quot;&gt;&lt;i data-lucide=&quot;arrow-right&quot;&gt;&lt;/i&gt;&lt;span&gt;review boundary&lt;/span&gt;&lt;/div&gt;
                  &lt;div class=&quot;nf-gate-next&quot;&gt;&lt;span&gt;human authority&lt;/span&gt;&lt;strong&gt;Gate ②&lt;/strong&gt;&lt;span&gt;scrub + substantive review&lt;/span&gt;&lt;/div&gt;
                &lt;/div&gt;
              &lt;/div&gt;
              &lt;p class=&quot;nf-path-message&quot; id=&quot;nf-path-message&quot;&gt;Assignment + shape + selected voice profile + evidence → Writer → banked draft → Gate ②.&lt;/p&gt;
            &lt;/section&gt;

            &lt;aside class=&quot;nf-detail&quot; id=&quot;nf-bottle-detail&quot; aria-live=&quot;polite&quot;&gt;
              &lt;div class=&quot;nf-label-row&quot;&gt;&lt;span class=&quot;nf-step-label&quot; id=&quot;nf-bottle-label&quot;&gt;Prompt input · profile&lt;/span&gt;&lt;/div&gt;
              &lt;h3 id=&quot;nf-bottle-title&quot;&gt;Voice profile&lt;/h3&gt;
              &lt;div class=&quot;nf-owner&quot;&gt;&lt;i data-lucide=&quot;folder&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span id=&quot;nf-bottle-owner&quot;&gt;voice/man-page-dry/&lt;/span&gt;&lt;/div&gt;
              &lt;dl class=&quot;nf-detail-grid&quot;&gt;
                &lt;div class=&quot;nf-detail-item&quot;&gt;&lt;dt&gt;Loads&lt;/dt&gt;&lt;dd id=&quot;nf-bottle-input&quot;&gt;moves.md and two harvested JSON samples&lt;/dd&gt;&lt;/div&gt;
                &lt;div class=&quot;nf-detail-item&quot;&gt;&lt;dt&gt;Rule&lt;/dt&gt;&lt;dd id=&quot;nf-bottle-rule&quot;&gt;Samples carry the voice; named moves stay deliberately thin&lt;/dd&gt;&lt;/div&gt;
                &lt;div class=&quot;nf-detail-item&quot;&gt;&lt;dt&gt;Failure boundary&lt;/dt&gt;&lt;dd id=&quot;nf-bottle-boundary&quot;&gt;An empty samples directory hard-fails instead of drafting voiceless&lt;/dd&gt;&lt;/div&gt;
              &lt;/dl&gt;
            &lt;/aside&gt;
          &lt;/div&gt;
        &lt;/section&gt;
      &lt;/main&gt;
    &lt;/div&gt;
  &lt;/section&gt;
&lt;/div&gt;

&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;newsroom-operating-manual-v2&#x27;);
  const stages = [
    { title: &#x27;Ingest ore&#x27;, kind: &#x27;intake&#x27;, owner: &#x27;Scout intake&#x27;, roles: [&#x27;Scout&#x27;], input: &#x27;Session logs and explicit reads of git, documents, and ledgers&#x27;, done: &#x27;Immutable ore records with source provenance&#x27;, next: &#x27;Capture is passive: ingestion never initiates synthesis or changes editorial state.&#x27; },
    { title: &#x27;Walk &amp; synthesize&#x27;, kind: &#x27;prospecting&#x27;, owner: &#x27;Scout&#x27;, roles: [&#x27;Scout&#x27;], input: &#x27;Cursor-bounded ore pages; then selected stored jewels, the map tail, box index, and status-blind dedup memory&#x27;, done: &#x27;The walk creates and persists jewels: each is one tight finding (a principle, correction, reframe, decision, or aha) anchored to the exact source record it came from. Synthesis then turns selected jewels into leads with ID, pitch, why-now, citations, type, and agent span.&#x27;, next: &#x27;Scout taste remains status-blind: downstream editorial verdicts never feed back into discovery.&#x27; },
    { title: &#x27;File lead&#x27;, kind: &#x27;store&#x27;, owner: &#x27;Scout ledger&#x27;, roles: [&#x27;Scout&#x27;], input: &#x27;A synthesized lead from the Scout&#x27;, done: &#x27;Append-only leads.yaml record at status new with redaction required; its stable ID becomes the handle&#x27;, next: &#x27;The Scout appends leads; it never edits or removes an existing lead.&#x27; },
    { title: &#x27;Propose triage&#x27;, kind: &#x27;advice&#x27;, owner: &#x27;Wire Editor + chief shadow&#x27;, roles: [&#x27;Wire&#x27;], input: &#x27;Every new lead plus IDs already claimed, drafted, published, or spiked&#x27;, done: &#x27;A proposal to claim, hold, or spike, with suggested type, reason, clusters, and chief shadow&#x27;, next: &#x27;Triage is advice. It cannot mutate the lead ledger or make the routing decision.&#x27; },
    { title: &#x27;Gate ① · route&#x27;, kind: &#x27;human gate&#x27;, owner: &#x27;Operator&#x27;, roles: [&#x27;Editor&#x27;], input: &#x27;Scout lead, Wire advice, and chief shadow&#x27;, done: &#x27;A durable human decision: claim, hold, or spike, plus the effective type and destination&#x27;, next: &#x27;The operator is the routing authority; agents may recommend but cannot cross this gate.&#x27; },
    { title: &#x27;Create draft&#x27;, kind: &#x27;production&#x27;, owner: &#x27;Writer&#x27;, roles: [&#x27;Writer&#x27;], input: &#x27;Claimed assignment + content shape + selected voice bottle + convergent reads of cited sources&#x27;, done: &#x27;A revisioned, structured draft with evidence and copyDraft provenance&#x27;, next: &#x27;The Writer drafts only: it cannot route, approve, publish, or alter the presentation layer.&#x27; },
    { title: &#x27;Gate ② · approve&#x27;, kind: &#x27;human gate&#x27;, owner: &#x27;Operator&#x27;, roles: [&#x27;Editor&#x27;], input: &#x27;The exact draft revision, its evidence, mechanical scan findings, and substantive/voice review&#x27;, done: &#x27;Human approval bound to that revision after the scrub is complete&#x27;, next: &#x27;A clean scan is evidence for the operator, never a substitute for human approval.&#x27; },
    { title: &#x27;Queue &amp; release&#x27;, kind: &#x27;delivery&#x27;, owner: &#x27;Release + generator&#x27;, roles: [&#x27;Release&#x27;], input: &#x27;An approved draft revision and its selected destination&#x27;, done: &#x27;A queued publication record; release stamps the publication date and deterministic generation renders the page&#x27;, next: &#x27;Promotion is not publication: queued and released remain distinct states with traceable provenance.&#x27; }
  ];

  const roleStageMap = {
    Scout: [0, 1, 2],
    Wire: [3],
    Editor: [4, 6],
    Writer: [5],
    Release: [7]
  };

  const roleDetails = {
    Scout: {
      label: &#x27;Newsroom role · discovery&#x27;,
      title: &#x27;Scout&#x27;,
      seat: &#x27;Agent seat · touches 3 stages&#x27;,
      responsibility: &#x27;Looks for stories in the server’s own working history: session logs, commits, operations ledgers, and the record of agent decisions.&#x27;,
      handoff: &#x27;Append-only lead records with stable IDs, pitches, why-now arguments, source pointers, types, and agent spans → Wire Editor and Gate ①.&#x27;,
      guardrail: &#x27;Scout memory maps where to look, but remains blind to downstream editorial verdicts so discovery does not learn to chase approval.&#x27;
    },
    Wire: {
      label: &#x27;Newsroom role · triage&#x27;,
      title: &#x27;Wire Editor&#x27;,
      seat: &#x27;Agent seat · touches 1 stage&#x27;,
      responsibility: &#x27;Reads the pile of new leads and proposes a shortlist: claim, hold, or spike.&#x27;,
      handoff: &#x27;A triage proposal with suggested type, reason, clusters, and chief shadow → Gate ①.&#x27;,
      guardrail: &#x27;Triage is advice. The Wire Editor cannot mutate the lead ledger or make the routing decision.&#x27;
    },
    Editor: {
      label: &#x27;Newsroom role · authority&#x27;,
      title: &#x27;Editor&#x27;,
      seat: &#x27;Human seat · touches 2 stages&#x27;,
      responsibility: &#x27;Decides what gets pursued and approves every word before it goes public.&#x27;,
      handoff: &#x27;Gate ① produces the effective type and destination. Gate ② produces approval bound to the exact reviewed revision.&#x27;,
      guardrail: &#x27;Final approval never moves to a machine. Automated findings inform the editor; they do not replace editorial judgment.&#x27;
    },
    Writer: {
      label: &#x27;Newsroom role · production&#x27;,
      title: &#x27;Writer&#x27;,
      seat: &#x27;Agent seat · touches 1 stage&#x27;,
      responsibility: &#x27;Turns an approved lead into a draft in the register the piece calls for.&#x27;,
      handoff: &#x27;A revisioned structured draft with evidence and copyDraft provenance → scrub and Gate ②.&#x27;,
      guardrail: &#x27;The Writer has no voice of its own: it works from selected exemplars, and it cannot route, approve, publish, or alter presentation.&#x27;
    },
    Release: {
      label: &#x27;System role · delivery&#x27;,
      title: &#x27;Release system&#x27;,
      seat: &#x27;System function · touches 1 stage&#x27;,
      responsibility: &#x27;Promotes an approved draft into the publication queue, stamps the release date, and renders the page deterministically.&#x27;,
      handoff: &#x27;Queued publication record → released page with traceable provenance.&#x27;,
      guardrail: &#x27;Promotion is not publication. Queued and released remain distinct states, and release cannot supply missing approval.&#x27;
    }
  };

  let current = 0;
  let selectedRole = stages[0].roles[0];
  let activeView = &#x27;flow&#x27;;
  let detailMode = &#x27;stage&#x27;;

  const stageButtons = [...root.querySelectorAll(&#x27;.nf-stage&#x27;)];
  const el = id =&gt; root.querySelector(&#x27;#&#x27; + id);

  function syncRoleButtons() {
    root.querySelectorAll(&#x27;.nf-role&#x27;).forEach(button =&gt; {
      button.setAttribute(&#x27;aria-pressed&#x27;, String(button.dataset.role === selectedRole));
    });
  }

  function renderStageDetail(stage) {
    el(&#x27;nf-step-label&#x27;).textContent = `Stage ${current + 1} · ${stage.kind}`;
    el(&#x27;nf-stage-title&#x27;).textContent = stage.title;
    el(&#x27;nf-owner&#x27;).textContent = `Owner: ${stage.owner}`;
    el(&#x27;nf-input-label&#x27;).textContent = &#x27;Reads&#x27;;
    el(&#x27;nf-done-label&#x27;).textContent = &#x27;Writes&#x27;;
    el(&#x27;nf-next-label&#x27;).textContent = &#x27;Guardrail&#x27;;
    el(&#x27;nf-input&#x27;).textContent = stage.input;
    el(&#x27;nf-done&#x27;).textContent = stage.done;
    el(&#x27;nf-next&#x27;).textContent = stage.next;
    el(&#x27;nf-detail-actions&#x27;).hidden = false;
    el(&#x27;nf-back&#x27;).disabled = current === 0;
    el(&#x27;nf-next-button&#x27;).textContent = current === stages.length - 1 ? &#x27;Restart map&#x27; : &#x27;Next stage&#x27;;
  }

  function renderRoleDetail() {
    const role = roleDetails[selectedRole];
    el(&#x27;nf-step-label&#x27;).textContent = role.label;
    el(&#x27;nf-stage-title&#x27;).textContent = role.title;
    el(&#x27;nf-owner&#x27;).textContent = role.seat;
    el(&#x27;nf-input-label&#x27;).textContent = &#x27;Responsibility&#x27;;
    el(&#x27;nf-done-label&#x27;).textContent = &#x27;Handoff&#x27;;
    el(&#x27;nf-next-label&#x27;).textContent = &#x27;Guardrail&#x27;;
    el(&#x27;nf-input&#x27;).textContent = role.responsibility;
    el(&#x27;nf-done&#x27;).textContent = role.handoff;
    el(&#x27;nf-next&#x27;).textContent = role.guardrail;
    el(&#x27;nf-detail-actions&#x27;).hidden = true;
    el(&#x27;nf-handoff&#x27;).textContent = &#x27;&#x27;;
  }

  function render() {
    const stage = stages[current];
    stageButtons.forEach((button, index) =&gt; {
      if (index === current) button.setAttribute(&#x27;aria-current&#x27;, &#x27;step&#x27;);
      else button.removeAttribute(&#x27;aria-current&#x27;);
      button.dataset.dim = activeView === &#x27;role&#x27; &amp;&amp; !roleStageMap[selectedRole].includes(index) ? &#x27;true&#x27; : &#x27;false&#x27;;
    });
    if (activeView === &#x27;role&#x27; &amp;&amp; detailMode === &#x27;role&#x27;) renderRoleDetail();
    else renderStageDetail(stage);
    el(&#x27;nf-progress&#x27;).textContent = `${current + 1} of ${stages.length}`;
    el(&#x27;nf-status-copy&#x27;).textContent = activeView === &#x27;role&#x27;
      ? `${roleDetails[selectedRole].title} touches ${roleStageMap[selectedRole].length} ${roleStageMap[selectedRole].length === 1 ? &#x27;stage&#x27; : &#x27;stages&#x27;}`
      : `Selected stage role: ${selectedRole}`;
  }

  stageButtons.forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; {
    current = Number(button.dataset.stage);
    selectedRole = stages[current].roles[0];
    detailMode = &#x27;stage&#x27;;
    el(&#x27;nf-handoff&#x27;).textContent = &#x27;&#x27;;
    syncRoleButtons();
    render();
  }));

  root.querySelectorAll(&#x27;.nf-role&#x27;).forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; {
    selectedRole = button.dataset.role;
    current = roleStageMap[selectedRole][0];
    detailMode = activeView === &#x27;role&#x27; ? &#x27;role&#x27; : &#x27;stage&#x27;;
    syncRoleButtons();
    render();
  }));

  el(&#x27;nf-back&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
    current = Math.max(0, current - 1);
    selectedRole = stages[current].roles[0];
    detailMode = &#x27;stage&#x27;;
    el(&#x27;nf-handoff&#x27;).textContent = &#x27;&#x27;;
    syncRoleButtons();
    render();
  });

  el(&#x27;nf-next-button&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
    const previous = stages[current].title;
    current = current === stages.length - 1 ? 0 : current + 1;
    selectedRole = stages[current].roles[0];
    detailMode = &#x27;stage&#x27;;
    syncRoleButtons();
    el(&#x27;nf-handoff&#x27;).textContent = current === 0 ? &#x27;New ore can enter; editorial verdicts never feed back into Scout taste.&#x27; : `${previous} hands off to ${stages[current].title}.`;
    render();
  });

  const viewCopy = {
    flow: [&#x27;Newsroom system flow&#x27;, &#x27;Follow evidence through triage, drafting, approval, and release.&#x27;],
    role: [&#x27;Responsibility by role&#x27;, &#x27;Choose a newsroom seat above to reveal the stages it touches.&#x27;]
  };

  root.querySelectorAll(&#x27;.nf-nav button&#x27;).forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; {
    root.querySelectorAll(&#x27;.nf-nav button&#x27;).forEach(item =&gt; item.setAttribute(&#x27;aria-pressed&#x27;, String(item === button)));
    const bottleView = button.dataset.view === &#x27;bottle&#x27;;
    el(&#x27;nf-system-pane&#x27;).hidden = bottleView;
    el(&#x27;nf-bottle-pane&#x27;).hidden = !bottleView;
    if (bottleView) {
      el(&#x27;nf-story-title&#x27;).textContent = &#x27;Voice bottle — written register enters the Writer at runtime&#x27;;
      return;
    }
    activeView = button.dataset.view;
    root.dataset.systemView = activeView;
    el(&#x27;nf-story-title&#x27;).textContent = &#x27;Newsroom system — evidence to published work&#x27;;
    const [title, subtitle] = viewCopy[button.dataset.view];
    el(&#x27;nf-view-title&#x27;).textContent = title;
    el(&#x27;nf-view-subtitle&#x27;).textContent = subtitle;
    selectedRole = stages[current].roles[0];
    detailMode = activeView === &#x27;role&#x27; ? &#x27;role&#x27; : &#x27;stage&#x27;;
    syncRoleButtons();
    render();
  }));

  const bottleDetails = {
    assignment: { label: &#x27;Runtime input · assignment&#x27;, title: &#x27;Claimed lead&#x27;, owner: &#x27;pipelines/writer/assignment.py&#x27;, input: &#x27;The full lead: stable ID, pitch, why-now, type, and source pointers&#x27;, rule: &#x27;The effective assignment is the durable output of Gate ①&#x27;, boundary: &#x27;The Writer receives routing context but cannot change the routing decision.&#x27; },
    shape: { label: &#x27;System prompt · structure&#x27;, title: &#x27;Shape prompt&#x27;, owner: &#x27;agents/writer_agent.py&#x27;, input: &#x27;Three beats, 798–882 body characters, receipts as lists, and the strict note JSON schema&#x27;, rule: &#x27;Shape belongs in the Writer prompt; the bottle carries sentence-level voice&#x27;, boundary: &#x27;Samples outrank written instructions. A shape change requires the exemplars to be re-cut with it.&#x27; },
    bottle: { label: &#x27;Prompt input · profile&#x27;, title: &#x27;Voice bottle&#x27;, owner: &#x27;voice/man-page-dry/&#x27;, input: &#x27;moves.md and harvested JSON samples, loaded in sorted order&#x27;, rule: &#x27;Samples carry the voice; named moves stay deliberately thin. Wit is watched for, never commissioned.&#x27;, boundary: &#x27;An empty samples directory hard-fails instead of drafting without an established voice.&#x27; },
    evidence: { label: &#x27;Tool loop · evidence&#x27;, title: &#x27;Convergent roam&#x27;, owner: &#x27;Writer using the Scout’s read tools&#x27;, input: &#x27;The assignment’s cited transcript, files, and commits inside registered roots&#x27;, rule: &#x27;Pull exactly the cited threads until the draft can be written from receipts, not vibes&#x27;, boundary: &#x27;Missing facts are researched further or written around, never invented.&#x27; },
    seat: { label: &#x27;Model call · production&#x27;, title: &#x27;Writer call&#x27;, owner: &#x27;Writer model seat&#x27;, input: &#x27;Stable system block (shape + bottle), changing assignment, and tool results&#x27;, rule: &#x27;The model produces the note under the shape, voice, and evidence constraints&#x27;, boundary: &#x27;Truncation fails loudly; a refused call cannot silently become an incomplete draft.&#x27; },
    output: { label: &#x27;Runtime output · parked&#x27;, title: &#x27;Banked draft&#x27;, owner: &#x27;pipelines/writer/run.py&#x27;, input: &#x27;Strict structured JSON from the model; cited sources remain attached to the draft record&#x27;, rule: &#x27;Code adds copyDraft provenance, parks the artifact, and advances the lead to drafted&#x27;, boundary: &#x27;The Writer never touches HTML or publishes. The draft must still cross scrub and human Gate ②.&#x27; }
  };

  const bottleContext = {
    assignment: &#x27;story&#x27;,
    evidence: &#x27;story&#x27;,
    shape: &#x27;system&#x27;,
    bottle: &#x27;system&#x27;,
    seat: &#x27;both&#x27;,
    output: &#x27;output&#x27;
  };

  let activeBottle = &#x27;bottle&#x27;;
  function renderBottle(key = activeBottle) {
    activeBottle = key;
    const detail = bottleDetails[key];
    root.querySelectorAll(&#x27;[data-bottle]&#x27;).forEach(node =&gt; node.setAttribute(&#x27;aria-pressed&#x27;, String(node.dataset.bottle === key)));
    el(&#x27;nf-injection-map&#x27;).dataset.activeContext = bottleContext[key];
    el(&#x27;nf-bottle-label&#x27;).textContent = detail.label;
    el(&#x27;nf-bottle-title&#x27;).textContent = detail.title;
    el(&#x27;nf-bottle-owner&#x27;).textContent = detail.owner;
    el(&#x27;nf-bottle-input&#x27;).textContent = detail.input;
    el(&#x27;nf-bottle-rule&#x27;).textContent = detail.rule;
    el(&#x27;nf-bottle-boundary&#x27;).textContent = detail.boundary;
  }

  root.querySelectorAll(&#x27;[data-bottle]&#x27;).forEach(node =&gt; node.addEventListener(&#x27;click&#x27;, () =&gt; renderBottle(node.dataset.bottle)));

  const design = { compact: false, showRoleRail: true, accent: &#x27;#d84a32&#x27; };
  function applyDesign() {
    root.dataset.compact = String(design.compact);
    root.dataset.showRail = String(design.showRoleRail);
    root.style.setProperty(&#x27;--nf-accent&#x27;, design.accent);
  }
  applyDesign();

  if (globalThis.Tweak) {
    const tweak = new Tweak({ container: root, onChange: applyDesign });
    tweak.addToggle(design, &#x27;compact&#x27;, { label: &#x27;Compact density&#x27;, reference: &#x27;newsroom.compact&#x27; });
    tweak.addToggle(design, &#x27;showRoleRail&#x27;, { label: &#x27;Show view rail&#x27;, reference: &#x27;newsroom.showRoleRail&#x27; });
    tweak.addColorPicker(design, &#x27;accent&#x27;, { label: &#x27;Newsroom accent&#x27;, reference: &#x27;--nf-accent&#x27; });
  }

  syncRoleButtons();
  render();
  renderBottle();
})();

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) =&gt; {
    lastPointerWasTouch =
      event.type === &quot;pointerdown&quot; &amp;&amp; event.pointerType === &quot;touch&quot;;
  };
  const handleTouchClick = (event) =&gt; {
    const isTouch = event.pointerType === &quot;touch&quot; || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch &amp;&amp; activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() =&gt; {
      if (activeTrigger === trigger &amp;&amp; !trigger.isConnected) {
        closeTooltip(false);
      }
    }, 0);
  };
  const handleLeave = (event) =&gt; {
    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    lastPointerWasTouch = false;
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    lastPointerWasTouch = false;
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerdown&quot;, handlePointer);
    document.removeEventListener(&quot;pointercancel&quot;, handlePointer);
    document.removeEventListener(&quot;click&quot;, handleTouchClick);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerdown&quot;, handlePointer);
  document.addEventListener(&quot;pointercancel&quot;, handlePointer);
  document.addEventListener(&quot;click&quot;, handleTouchClick);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-tabs&quot;&gt;
(() =&gt; {
  const selector = &#x27;.nav[role=&quot;tablist&quot;] [role=&quot;tab&quot;]&#x27;;
  const disabled = &#x27;:disabled,[aria-disabled=&quot;true&quot;]&#x27;;
  const selectTab = (selected) =&gt; {
    const panelId = selected.getAttribute(&quot;aria-controls&quot;);
    for (const tab of selected.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;)) {
      const active = tab === selected;
      tab.classList.toggle(&quot;active&quot;, active);
      tab.setAttribute(&quot;aria-selected&quot;, String(active));
      const id = tab.getAttribute(&quot;aria-controls&quot;);
      const panel = id &amp;&amp; document.getElementById(id);
      if (panel != null) {
        panel.hidden = id !== panelId;
        if (!panel.hidden &amp;&amp; selected.id) {
          panel.setAttribute(&quot;aria-labelledby&quot;, selected.id);
        }
      }
    }
  };
  const interact = (event) =&gt; {
    const tab = event.target?.closest?.(selector);
    if (event.defaultPrevented || tab == null || tab.matches(disabled)) {
      return;
    }
    if (event.type === &quot;click&quot;) {
      selectTab(tab);
      return;
    }
    const tabs = Array.from(
      tab.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;),
    ).filter((candidate) =&gt; !candidate.matches(disabled));
    const current = tabs.indexOf(tab);
    let next;
    if (event.key === &quot;ArrowRight&quot; || event.key === &quot;ArrowDown&quot;) {
      next = (current + 1) % tabs.length;
    } else if (event.key === &quot;ArrowLeft&quot; || event.key === &quot;ArrowUp&quot;) {
      next = (current + tabs.length - 1) % tabs.length;
    } else if (event.key === &quot;Home&quot;) {
      next = 0;
    } else if (event.key === &quot;End&quot;) {
      next = tabs.length - 1;
    } else {
      return;
    }
    event.preventDefault();
    tabs[next].focus();
    selectTab(tabs[next]);
  };

  for (const list of document.querySelectorAll(&#x27;.nav[role=&quot;tablist&quot;]&#x27;)) {
    const selected =
      list.querySelector(&#x27;[role=&quot;tab&quot;][aria-selected=&quot;true&quot;]&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;].active&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;]&#x27;);
    if (selected != null) {
      selectTab(selected);
    }
  }
  document.addEventListener(&quot;click&quot;, interact);
  document.addEventListener(&quot;keydown&quot;, interact);
  window.addEventListener(&quot;pagehide&quot;, () =&gt; {
    document.removeEventListener(&quot;click&quot;, interact);
    document.removeEventListener(&quot;keydown&quot;, interact);
  }, { once: true });
})();
&lt;/script&gt;
