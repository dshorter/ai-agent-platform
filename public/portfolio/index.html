<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daniel's Adaptive Portfolio</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-color: #c9d1d9;
            --accent-color: #58a6ff;
            --success-color: #2ea043;
            --border-color: #30363d;
            --fallback-color: #8b949e;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* --- THE COCKPIT --- */
        .control-deck {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 8px;
            display: flex;
            gap: 20px; /* Reduced gap slightly to fit 3 items */
            margin-bottom: 40px;
            width: 100%;
            max-width: 900px; /* Widened slightly */
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .control-group {
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        label {
            font-size: 0.75em;
            color: var(--fallback-color);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 600;
        }

        select {
            background: #0d1117;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 12px;
            font-size: 1em;
            border-radius: 6px;
            cursor: pointer;
            outline: none;
            transition: border 0.2s;
        }
        select:focus { border-color: var(--accent-color); }

        /* Highlight the Project Selector to make it distinct */
        #projectSelect {
            border-color: var(--accent-color);
            background: rgba(88, 166, 255, 0.05);
        }

        /* --- THE MAIN STAGE --- */
        .viewport {
            width: 100%;
            max-width: 900px;
            min-height: 350px;
            position: relative;
        }

        /* CARD STYLES */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            opacity: 0;
            transform: translateY(10px);
            animation: fadeIn 0.4s forwards;
            display: flex;
            flex-direction: column;
            height: 100%;
            box-sizing: border-box;
        }

        @keyframes fadeIn {
            to { opacity: 1; transform: translateY(0); }
        }

        .card-header {
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
            margin-bottom: 20px;
        }

        .tag {
            display: inline-block;
            font-size: 0.7em;
            padding: 4px 8px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            border: 1px solid currentColor;
        }

        h2 { margin: 0; font-weight: 400; font-size: 1.8em; letter-spacing: -0.5px; }

        .card-body { flex-grow: 1; margin-bottom: 30px; line-height: 1.6; color: #8b949e; }

        /* TYPE VARIANTS */
        .type-artifact .tag { color: var(--accent-color); border-color: var(--accent-color); }
        .type-artifact h2 { color: var(--accent-color); }
        .type-artifact .snippet-window {
            background: #000;
            padding: 15px;
            border-left: 3px solid var(--accent-color);
            font-family: monospace;
            font-size: 0.9em;
            color: #d2a8ff;
            margin-top: 15px;
            border-radius: 0 4px 4px 0;
            overflow-x: auto;
        }

        .type-outcome .tag { color: var(--success-color); border-color: var(--success-color); }
        .type-outcome h2 { color: var(--text-color); }
        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }
        .stat-box {
            background: rgba(46, 160, 67, 0.1);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid rgba(46, 160, 67, 0.3);
        }
        .stat-val { font-size: 2em; color: var(--success-color); font-weight: bold; }
        .stat-lbl { font-size: 0.8em; text-transform: uppercase; color: var(--text-color); }

        .type-methodology .tag { color: #f0883e; border-color: #f0883e; }
        .type-methodology h2 { color: #fff; }

        .action-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 24px;
            background: var(--border-color);
            color: #fff;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            transition: 0.2s;
            align-self: flex-start;
        }
        .action-btn:hover {
            background: var(--accent-color);
            color: #000;
        }

        .fallback-container {
            border: 1px dashed var(--fallback-color);
            padding: 40px;
            text-align: center;
            color: var(--fallback-color);
            font-family: monospace;
        }

    </style>
</head>
<body>

    <div class="control-deck">
        <div class="control-group">
            <label style="color:var(--accent-color);">Target System (Project)</label>
            <select id="projectSelect" onchange="render()">
                <option value="n8n_bot">n8n Automation Cluster</option>
                <option value="hvac_twin">HVAC Digital Twin</option>
            </select>
        </div>

        <div class="control-group">
            <label>Perspective</label>
            <select id="audienceSelect" onchange="render()">
                <option value="hr">HR / Recruiter</option>
                <option value="tech_lead">Technical Lead</option>
                <option value="manager">Manager / Product</option>
            </select>
        </div>
        <div class="control-group">
            <label>Depth</label>
            <select id="depthSelect" onchange="render()">
                <option value="surface">Surface</option>
                <option value="explanation">Explanation</option>
                <option value="evidence">Evidence</option>
            </select>
        </div>
    </div>

    <div id="viewport" class="viewport"></div>

    <script>
        // --- THE DATA MODEL (Wrapper Pattern) ---
        const portfolioData = {
            
            // === PROJECT 1: N8N ===
            "n8n_bot": {
                "tech_lead": {
                    "evidence": {
                        "status": "ready",
                        "type": "ARTIFACT",
                        "headline": "Zero-Maintenance Event Bus",
                        "body": "Utilizing n8n as a middleware orchestration layer to decouple frontend triggers from backend execution.",
                        "snippet": "const route = (req) => {\n  if(req.headers['x-event'] === 'urgent')\n    return highPriorityQueue.add(req.body);\n};",
                        "link_text": "View GitHub Repo",
                        "link_url": "#"
                    }
                },
                "manager": {
                    "evidence": {
                        "status": "ready",
                        "type": "OUTCOME",
                        "headline": "40% OpEx Reduction",
                        "body": "Automating this workflow removed 12 hours of manual data entry per week.",
                        "stats": [
                            { val: "40%", lbl: "OpEx Reduction" },
                            { val: "12h", lbl: "Saved/Week" }
                        ],
                        "link_text": "View ROI Sheet",
                        "link_url": "#"
                    }
                }
            },

            // === PROJECT 2: HVAC (Duplicated Structure) ===
            "hvac_twin": {
                "tech_lead": {
                    "evidence": {
                        "status": "ready",
                        "type": "ARTIFACT",
                        "headline": "MQTT Telemetry Stream",
                        "body": "Ingesting 500 datapoints/sec via Mosquitto Broker on a low-cost VPS.",
                        "snippet": "client.on('message', (topic, message) => {\n  // Buffer stream to InfluxDB\n  db.writePoints([\n    { measurement: 'temp', fields: { value: parseFloat(message) } }\n  ]);\n});",
                        "link_text": "View Architecture Diagram",
                        "link_url": "#"
                    }
                },
                "manager": {
                     "surface": {
                        "status": "ready",
                        "type": "METHODOLOGY",
                        "headline": "Real-Time Facility Monitoring",
                        "body": "A digital twin dashboard that allows facility managers to detect anomalies before equipment failure.",
                        "link_text": "View Live Demo",
                        "link_url": "#"
                    }
                }
            }
        };

        function render() {
            // 1. GET ALL INPUTS
            const project = document.getElementById('projectSelect').value;
            const audience = document.getElementById('audienceSelect').value;
            const depth = document.getElementById('depthSelect').value;
            
            const container = document.getElementById('viewport');
            container.innerHTML = ''; // Clear

            // 2. DRILL DOWN: Project -> Audience -> Depth
            // We use optional chaining (?.) just in case a key is missing
            const projectData = portfolioData[project];
            const audienceData = projectData ? projectData[audience] : null;
            const data = audienceData ? audienceData[depth] : null;

            // 3. FALLBACK LOGIC
            if (!data || data.status !== 'ready') {
                container.innerHTML = `
                    <div class="fallback-container">
                        > SYSTEM_CHECK: [${project.toUpperCase()}]<br>
                        > TARGET: [${audience.toUpperCase()} : ${depth.toUpperCase()}]<br><br>
                        DATA_MISSING_OR_DRAFT<br>
                        <span style="font-size:0.8em; color:#555">Try: Tech Lead > Evidence</span>
                    </div>`;
                return;
            }

            // 4. RENDER CARD
            const card = document.createElement('div');
            card.className = `card type-${data.type.toLowerCase()}`;

            let html = `
                <div class="card-header">
                    <span class="tag">${data.type} VIEW</span>
                    <h2>${data.headline}</h2>
                </div>
                <div class="card-body">
                    <p>${data.body}</p>
            `;

            if (data.type === 'ARTIFACT' && data.snippet) {
                html += `<div class="snippet-window">${data.snippet}</div>`;
            }
            if (data.type === 'OUTCOME' && data.stats) {
                html += `<div class="stat-grid">`;
                data.stats.forEach(stat => {
                    html += `
                        <div class="stat-box">
                            <div class="stat-val">${stat.val}</div>
                            <div class="stat-lbl">${stat.lbl}</div>
                        </div>`;
                });
                html += `</div>`;
            }

            html += `</div>`; // Close Body

            if (data.link_url) {
                html += `<a href="${data.link_url}" target="_blank" class="action-btn">${data.link_text} &rarr;</a>`;
            }

            card.innerHTML = html;
            container.appendChild(card);
        }

        // Init
        render();
    </script>
</body>
</html>
