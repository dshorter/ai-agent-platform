[project]
name = "ai-agent-platform"
version = "0.1.0"
description = "Semi-autonomous AI crew — commit-to-blog pipeline for uzelhub.com"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "claude-agent-sdk>=0.1.0",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "pyjwt>=2.9",
    "python-slugify>=8.0",
    "python-json-logger>=2.0",
    "markdown-it-py>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
# rootdir on sys.path so tests import `pipelines.*` without an editable install
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents", "pipelines"]
